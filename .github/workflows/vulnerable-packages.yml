# Weekly + on-demand scan for NuGet packages with known CVEs.
#
# Why this exists when Dependabot already opens vulnerability PRs:
#   - Dependabot opens PRs once a vuln is in its database AND a fix version exists
#   - This workflow surfaces any vulnerable package (including transitives) right
#     now, even if no fix version is published yet — useful for triage decisions
#     (replace package, downgrade, or accept risk with a comment)
#   - Faster signal than waiting for Dependabot's indexing cadence
#
# Failure mode: job fails if ANY vulnerable package is reported. Triage the
# output, decide whether to bump, replace, or document the accepted risk.
name: VULNERABLE_PACKAGES

on:
  schedule:
    # Monday 06:00 UTC — same cadence as codeql.yml, before the work week starts
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: vulnerable-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          # This job only reads source to run `dotnet list`; no later step needs
          # the GITHUB_TOKEN checkout left in .git/config. Drop it.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      # --include-transitive surfaces vulns in indirect deps too — most CVE
      # exposure comes through transitives, not top-level package refs.
      # --format json is supported in .NET SDK 10 and gives us a structured
      # output we can gate on programmatically instead of grepping prose, which
      # would break if the human-readable wording ever changed.
      - name: List vulnerable packages
        run: |
          set -uo pipefail
          # Two-step: human-readable copy goes to the log for diagnosis; JSON
          # copy feeds the gate. Reusing one invocation would mean stripping
          # the table from the JSON output, which is messier.
          dotnet list package --vulnerable --include-transitive
          json=$(dotnet list package --vulnerable --include-transitive --format json)
          # The JSON shape is { projects: [ { frameworks: [ { topLevelPackages: [...vulnerabilities:[...] ] / transitivePackages:[...] } ] } ] }.
          # Anything with a populated vulnerabilities array counts.
          vuln_count=$(echo "$json" | jq '[.. | objects | select(has("vulnerabilities")) | .vulnerabilities[]?] | length')
          if [ "${vuln_count:-0}" -gt 0 ]; then
            echo "::error::Vulnerable NuGet packages found (${vuln_count} vulnerability records). Triage above output: bump, replace, or document accepted risk."
            exit 1
          fi
          echo "No vulnerable packages reported."
