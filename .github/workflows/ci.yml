name: BUILD_AND_TEST

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# When a PR is updated rapidly, cancel earlier in-flight runs on the same ref —
# only the latest commit matters for merge gating.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write          # test-reporter publishes results as a check run
      pull-requests: write   # ...and annotates the PR

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Cache the NuGet global packages folder keyed on Directory.Packages.props (Central
      # Package Management is our source of truth for versions). Cache hit cuts each run by
      # the cold-restore time (~30-60s on a fresh runner).
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # Unit tests only — the FullyQualifiedName filter excludes *.Tests.Integration
      # (those run in the dedicated job below, which has Docker). --logger trx emits
      # machine-readable result files for the reporter step; --collect "XPlat Code
      # Coverage" produces Cobertura XML via Coverlet. Both land under ./test-results.
      - name: Unit tests
        run: >
          dotnet test --no-build --no-restore
          --filter "FullyQualifiedName!~Tests.Integration"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"

      # Surfaces pass/fail counts + failed-test names as a check run in the PR UI,
      # instead of making you scroll the raw job log. Runs even on test failure
      # (that's the case where you most want the report).
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Unit Tests
          path: test-results/**/*.trx
          reporter: dotnet-trx

      # Renders the Cobertura coverage into a markdown table written to the job
      # summary. Measurement, not a gate — tells you what shipped untested.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:'test-results/**/coverage.cobertura.xml' \
            -targetdir:coverage-report \
            -reporttypes:'MarkdownSummaryGithub'
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Upload Cobertura coverage to Codecov so the README badge + dashboard get the
      # current run's data. Free for public OSS repos; needs no token for public repos
      # using GitHub Actions (Codecov reads the GITHUB_TOKEN claim automatically).
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          files: ./test-results/**/coverage.cobertura.xml
          flags: unit
          fail_ci_if_error: false       # coverage upload failure shouldn't fail the build
          verbose: false

      # Concurrency hazard #5 from docs/performance-and-data-correctness.md — the one
      # the build can't catch via analyzers because the distinction between
      # "type-init-immutable lookup table" and "shared mutable state" is structural.
      # Plain List<T>/Dictionary<,>/HashSet<T>/Queue<T>/Stack<T> as static fields are
      # banned wholesale; use ConcurrentDictionary<,>, ImmutableList<T>, FrozenDictionary<,>,
      # or Channel<T> instead. The \b word boundary lets ConcurrentDictionary, ImmutableList,
      # FrozenDictionary pass through.
      - name: Concurrency audit — static mutable collections
        run: |
          if grep -rnE 'static\s+(readonly\s+)?\b(List|Dictionary|HashSet|Queue|Stack)<' \
             --include="*.cs" \
             --exclude-dir=bin --exclude-dir=obj \
             --exclude-dir=Migrations --exclude-dir=tests .; then
            echo "::error::Shared static mutable collection found. Use ConcurrentDictionary / ImmutableList / FrozenDictionary / Channel<T> instead. See docs/performance-and-data-correctness.md 'Concurrency hazards: what the build enforces'."
            exit 1
          fi

      # Broken-link audit: relative markdown links to local source files (.cs/.csproj/.props/
      # .yml/.svg/.excalidraw/.md) that don't resolve. Catches drift from file renames and
      # the kind of fallout the simplicity refactor produced — CLAUDE.md citations pointing at
      # deleted PaymentRepository.cs, demo docs pointing at the pre-VSA-collapse 4-project
      # layout. Same shape as the static-mutable-collections check above: grep + fail. Skips
      # external URLs (https?://) and anchors-only (#section); resolves paths relative to
      # the markdown file's directory. Uses process substitution everywhere so the failure
      # flag survives the loop (a piped while runs in a subshell and loses its updates).
      - name: Broken-link audit — markdown citations to local files
        run: |
          fail=0
          while IFS= read -r mdfile; do
            dir=$(dirname "$mdfile")
            while IFS= read -r link; do
              case "$link" in http*|//*) continue ;; esac
              candidate="${link%%#*}"
              candidate="${candidate%%\?*}"
              if [ "$dir" = "." ]; then target="$candidate"; else target="$dir/$candidate"; fi
              if [ ! -e "$target" ] && [ ! -e "$candidate" ]; then
                echo "::error file=$mdfile::broken link → $link"
                fail=1
              fi
            done < <(grep -oE '\[[^]]+\]\(([^)#]+\.(cs|csproj|props|sh|yml|yaml|svg|excalidraw|cls|md))[^)#]*\)' "$mdfile" \
                     | sed -E 's/.*\(([^)]+)\)/\1/')
          done < <(find . -type f -name '*.md' \
                     -not -path './bin/*' -not -path './obj/*' \
                     -not -path '*/node_modules/*' -not -path '*/.git/*')
          exit "$fail"

  # Testcontainers-based integration tests, in their own job: they need Docker (the
  # ubuntu-latest runner ships it at the standard /var/run/docker.sock, so Testcontainers
  # auto-detects — no DOCKER_HOST override, unlike macOS Docker Desktop locally). Kept
  # separate from the unit job so the fast unit signal isn't gated on container startup.
  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Each integration project runs in its own step so a failure in one doesn't mask the
      # other, and the TRX filenames stay distinct for the reporter step's glob.
      # --collect "XPlat Code Coverage" emits Cobertura XML alongside the TRX so Codecov
      # sees integration-layer coverage too. Without it, Codecov reports unit-only and
      # the badge undersells what the repo actually exercises (Wolverine outbox + saga
      # handlers, EF migration application, HybridCache invalidation — all integration-only).
      - name: Integration tests — Catalog (Postgres + Redis)
        run: >
          dotnet test tests/CatalogService.Tests.Integration/CatalogService.Tests.Integration.csproj
          --logger "trx;LogFileName=catalog-integration.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"

      - name: Integration tests — Order (SQL Server, Wolverine outbox + saga)
        if: ${{ !cancelled() }}
        run: >
          dotnet test tests/OrderService.Tests.Integration/OrderService.Tests.Integration.csproj
          --logger "trx;LogFileName=order-integration.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"

      - name: Integration tests — Payment (SQL Server, outbox-in-non-handler wrap)
        if: ${{ !cancelled() }}
        run: >
          dotnet test tests/PaymentService.Tests.Integration/PaymentService.Tests.Integration.csproj
          --logger "trx;LogFileName=payment-integration.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"

      - name: Integration tests — Shipping (Postgres, IDOR + saga handlers)
        if: ${{ !cancelled() }}
        run: >
          dotnet test tests/ShippingService.Tests.Integration/ShippingService.Tests.Integration.csproj
          --logger "trx;LogFileName=shipping-integration.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"

      - name: Publish integration test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Integration Tests
          path: test-results/**/*.trx
          reporter: dotnet-trx

      # Upload integration-layer coverage to Codecov. Flagged "integration" so the
      # dashboard can distinguish unit vs integration contributions. Combined with the
      # "unit" flag from the build job, the overall % reflects what the codebase
      # actually exercises end-to-end (currently ~58% line, ~57% branch per
      # reportgenerator's aggregation in CLAUDE.md).
      - name: Upload integration coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          files: ./test-results/**/coverage.cobertura.xml
          flags: integration
          fail_ci_if_error: false
          verbose: false
