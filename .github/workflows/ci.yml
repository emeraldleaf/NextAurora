name: BUILD_AND_TEST

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# When a PR is updated rapidly, cancel earlier in-flight runs on the same ref —
# only the latest commit matters for merge gating.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write          # test-reporter publishes results as a check run
      pull-requests: write   # ...and annotates the PR

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Cache the NuGet global packages folder keyed on Directory.Packages.props (Central
      # Package Management is our source of truth for versions). Cache hit cuts each run by
      # the cold-restore time (~30-60s on a fresh runner).
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # Unit tests only — the FullyQualifiedName filter excludes *.Tests.Integration
      # (those run in the dedicated job below, which has Docker). --logger trx emits
      # machine-readable result files for the reporter step; --collect "XPlat Code
      # Coverage" produces Cobertura XML via Coverlet. Both land under ./test-results.
      - name: Unit tests
        run: >
          dotnet test --no-build --no-restore
          --filter "FullyQualifiedName!~Tests.Integration"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"

      # Surfaces pass/fail counts + failed-test names as a check run in the PR UI,
      # instead of making you scroll the raw job log. Runs even on test failure
      # (that's the case where you most want the report).
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Unit Tests
          path: test-results/**/*.trx
          reporter: dotnet-trx

      # Renders the Cobertura coverage into a markdown table written to the job
      # summary. Measurement, not a gate — tells you what shipped untested.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:'test-results/**/coverage.cobertura.xml' \
            -targetdir:coverage-report \
            -reporttypes:'MarkdownSummaryGithub'
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Upload Cobertura coverage to Codecov so the README badge + dashboard get the
      # current run's data. Free for public OSS repos; needs no token for public repos
      # using GitHub Actions (Codecov reads the GITHUB_TOKEN claim automatically).
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: ./test-results/**/coverage.cobertura.xml
          flags: unit
          fail_ci_if_error: false       # coverage upload failure shouldn't fail the build
          verbose: false

      # Concurrency hazard #5 from docs/performance-and-data-correctness.md — the one
      # the build can't catch via analyzers because the distinction between
      # "type-init-immutable lookup table" and "shared mutable state" is structural.
      # Plain List<T>/Dictionary<,>/HashSet<T>/Queue<T>/Stack<T> as static fields are
      # banned wholesale; use ConcurrentDictionary<,>, ImmutableList<T>, FrozenDictionary<,>,
      # or Channel<T> instead. The \b word boundary lets ConcurrentDictionary, ImmutableList,
      # FrozenDictionary pass through.
      - name: Concurrency audit — static mutable collections
        run: |
          if grep -rnE 'static\s+(readonly\s+)?\b(List|Dictionary|HashSet|Queue|Stack)<' \
             --include="*.cs" \
             --exclude-dir=bin --exclude-dir=obj \
             --exclude-dir=Migrations --exclude-dir=tests .; then
            echo "::error::Shared static mutable collection found. Use ConcurrentDictionary / ImmutableList / FrozenDictionary / Channel<T> instead. See docs/performance-and-data-correctness.md 'Concurrency hazards: what the build enforces'."
            exit 1
          fi

      # CLAUDE.md size budget — enforces the "Keep this file lean" discipline from
      # CLAUDE.md "Continuous Rule Encoding" surface 1. Every byte of CLAUDE.md is loaded
      # into every Claude Code session AND is cognitive overhead for human readers. Soft
      # warning at 400 lines, hard fail at 500. When approaching either, audit each rule
      # and move detail to the relevant paired doc in docs/ or skill in .claude/skills/;
      # CLAUDE.md keeps headline + one-paragraph summary + link.
      - name: CLAUDE.md size budget
        run: |
          lines=$(wc -l < CLAUDE.md)
          echo "CLAUDE.md is $lines lines."
          if [ "$lines" -gt 500 ]; then
            echo "::error file=CLAUDE.md::CLAUDE.md exceeds 500-line hard limit (current: $lines). Move detail to docs/ or .claude/skills/ and leave a headline + link. See CLAUDE.md 'Continuous Rule Encoding' surface 1."
            exit 1
          fi
          if [ "$lines" -gt 400 ]; then
            echo "::warning file=CLAUDE.md::CLAUDE.md is approaching the size budget ($lines lines; soft limit 400, hard limit 500). Consider moving detail out."
          fi

      # Broken-link audit: relative markdown links to local source files (.cs/.csproj/.props/
      # .yml/.svg/.excalidraw/.md) that don't resolve. Catches drift from file renames and
      # the kind of fallout the simplicity refactor produced — CLAUDE.md citations pointing at
      # deleted PaymentRepository.cs, demo docs pointing at the pre-VSA-collapse 4-project
      # layout. Same shape as the static-mutable-collections check above: grep + fail. Skips
      # external URLs (https?://) and anchors-only (#section); resolves paths relative to
      # the markdown file's directory. Uses process substitution everywhere so the failure
      # flag survives the loop (a piped while runs in a subshell and loses its updates).
      - name: Broken-link audit — markdown citations to local files
        run: |
          fail=0
          while IFS= read -r mdfile; do
            dir=$(dirname "$mdfile")
            while IFS= read -r link; do
              case "$link" in http*|//*) continue ;; esac
              candidate="${link%%#*}"
              candidate="${candidate%%\?*}"
              if [ "$dir" = "." ]; then target="$candidate"; else target="$dir/$candidate"; fi
              if [ ! -e "$target" ] && [ ! -e "$candidate" ]; then
                echo "::error file=$mdfile::broken link → $link"
                fail=1
              fi
            done < <(grep -oE '\[[^]]+\]\(([^)#]+\.(cs|csproj|props|sh|yml|yaml|svg|excalidraw|cls|md))[^)#]*\)' "$mdfile" \
                     | sed -E 's/.*\(([^)]+)\)/\1/')
          done < <(find . -type f -name '*.md' \
                     -not -path './bin/*' -not -path './obj/*' \
                     -not -path '*/node_modules/*' -not -path '*/.git/*' \
                     -not -path './.claude/audits/INDEX.md')
          exit "$fail"
          # `.claude/audits/INDEX.md` is intentionally excluded — it links to per-article audit
          # files under `.claude/audits/*.md` that are gitignored for copyright reasons (they
          # contain verbatim quoted prose from external articles). See `.claude/commands/article-audit.md`
          # step 5 "Copyright note" — the contract is "INDEX ships, per-article files don't."
          # On a contributor's machine the links resolve; on the CI runner they don't, by design.

      # Broken-COPY audit: Dockerfile* COPY/ADD lines that reference source paths which
      # don't exist in the build context (the repo root). This is the gap the markdown
      # audit above can't close — `Dockerfile.catalog` rotted silently for months after
      # PR #31 (VSA collapse) because the broken paths only failed at deploy time, not
      # at build/test time. The Fly demo at https://catalog-api-demo.fly.dev kept running
      # pre-collapse code; any redeploy would have failed on the first COPY of a
      # nonexistent csproj. Same shape as the markdown audit: parse, check existence, fail.
      # Handles the common COPY forms: `COPY src dst`, `COPY src1 src2 dst` (multi-src),
      # and `COPY --from=stage src dst` (cross-stage; skips the src check since src is in
      # another build stage, not the repo). Skips wildcards (`COPY src/*.json .`) since
      # those resolve at build time, not against the repo tree. See CLAUDE.md "File-move
      # discipline" for the canonical rule.
      - name: Broken-COPY audit — Dockerfile source paths
        run: |
          fail=0
          while IFS= read -r dockerfile; do
            # Read each COPY/ADD line, strip the destination (last token), check each source.
            while IFS= read -r line; do
              # Skip `COPY --from=...` cross-stage copies (src is from a build stage, not the repo).
              case "$line" in *"--from="*) continue ;; esac
              # Strip the instruction keyword and any flags.
              args=$(echo "$line" | sed -E 's/^[[:space:]]*(COPY|ADD)[[:space:]]+//; s/--[a-zA-Z0-9=._/-]+[[:space:]]+//g')
              # Last token is the destination; everything before is source(s).
              srcs=$(echo "$args" | awk 'NF>1 {for(i=1;i<NF;i++) print $i}')
              for src in $srcs; do
                # Skip wildcards (resolved at build time, not against the repo tree).
                case "$src" in *"*"*|*"?"*|*"["*) continue ;; esac
                # Skip absolute paths (rare; not a build-context drift case).
                case "$src" in /*) continue ;; esac
                # Trim any trailing slash for the existence check.
                target="${src%/}"
                if [ ! -e "$target" ]; then
                  echo "::error file=$dockerfile::COPY/ADD source does not exist → $src"
                  fail=1
                fi
              done
            done < <(grep -iE '^[[:space:]]*(COPY|ADD)[[:space:]]+' "$dockerfile" || true)
          done < <(find . -type f \( -name 'Dockerfile' -o -name 'Dockerfile.*' \) \
                     -not -path './bin/*' -not -path './obj/*' \
                     -not -path '*/node_modules/*' -not -path '*/.git/*')
          exit "$fail"

      # Diagram-pair audit: every diagram in docs/ MUST exist as both an .excalidraw
      # source and a .svg export. Reviewers (humans + CodeRabbit) look at the .svg to
      # understand the system; the .excalidraw is the authoritative source that
      # contributors edit. If one exists without the other, the diagram is broken — a
      # .svg with no .excalidraw can't be edited at the source level, and a .excalidraw
      # with no .svg means reviewers see the stale state on github.com (rendered SVGs
      # are inline-viewable; .excalidraw files aren't). Catches the case "I added a
      # new diagram source but forgot to render the SVG" and the inverse.
      #
      # This DOES NOT verify the .svg matches what would be regenerated from the
      # .excalidraw source — that needs the Playwright/excalidraw rendering pipeline
      # (see .claude/scripts/rebuild-diagrams.sh). That heavier check belongs in its
      # own workflow gated on .excalidraw changes; the pair-existence check is the
      # cheap mechanical floor. See CLAUDE.md "Doc-and-diagram discipline".
      - name: Diagram-pair audit — every .excalidraw needs a sibling .svg
        run: |
          fail=0
          while IFS= read -r excalidraw; do
            svg="${excalidraw%.excalidraw}.svg"
            if [ ! -f "$svg" ]; then
              echo "::error file=$excalidraw::diagram source without rendered .svg → expected $svg"
              fail=1
            fi
          done < <(find docs -maxdepth 2 -type f -name '*.excalidraw' 2>/dev/null || true)
          while IFS= read -r svg; do
            excalidraw="${svg%.svg}.excalidraw"
            if [ ! -f "$excalidraw" ]; then
              echo "::error file=$svg::rendered .svg without .excalidraw source → expected $excalidraw"
              fail=1
            fi
          done < <(find docs -maxdepth 2 -type f -name '*.svg' 2>/dev/null || true)
          exit "$fail"

      # Tombstone audit: removed identifiers (a deleted transport's API names, queue
      # names, metric names, trace sources) must not survive in docs/comments/config
      # as if they were current. The compiler catches stale identifiers in code;
      # nothing catches them in prose — the RabbitMQ swap left 15+ docs teaching the
      # removed transport as current, found by review instead of mechanically.
      # Patterns: .claude/tombstones.txt; historical/comparative exemptions:
      # .claude/tombstones-allowlist.txt. See CLAUDE.md "File-and-identifier-move
      # discipline".
      - name: Tombstone audit — removed identifiers must not resurface
        run: .claude/scripts/check-tombstones.sh

      # Messaging-topology completeness: every queue const reaches a publisher-side
      # .ToQueue() declaration, every listener is durable-inbox or inline, no inline
      # topology literals. The transport-stubbed integration tests structurally can't
      # catch these (AutoProvision off, routing stubbed); real-wire tests are deferred
      # (#68). See CLAUDE.md messaging trap bullets.
      - name: Messaging-topology audit — publisher declarations + listener durability
        run: .claude/scripts/check-messaging-topology.sh

  # Testcontainers-based integration tests, in their own job: they need Docker (the
  # ubuntu-latest runner ships it at the standard /var/run/docker.sock, so Testcontainers
  # auto-detects — no DOCKER_HOST override, unlike macOS Docker Desktop locally). Kept
  # separate from the unit job so the fast unit signal isn't gated on container startup.
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (incl. feature-boundary rules)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Vitest + RTL + MSW)
        run: npm test

      - name: Build
        run: npm run build

  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Each integration project runs in its own step so a failure in one doesn't mask the
      # other, and the TRX filenames stay distinct for the reporter step's glob.
      # --collect "XPlat Code Coverage" emits Cobertura XML alongside the TRX so Codecov
      # sees integration-layer coverage too. Without it, Codecov reports unit-only and
      # the badge undersells what the repo actually exercises (Wolverine outbox + saga
      # handlers, EF migration application, HybridCache invalidation — all integration-only).
      - name: Integration tests — Catalog (Postgres + Redis)
        run: >
          dotnet test tests/CatalogService.Tests.Integration/CatalogService.Tests.Integration.csproj
          --logger "trx;LogFileName=catalog-integration.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"

      - name: Integration tests — Order (SQL Server, Wolverine outbox + saga)
        if: ${{ !cancelled() }}
        run: >
          dotnet test tests/OrderService.Tests.Integration/OrderService.Tests.Integration.csproj
          --logger "trx;LogFileName=order-integration.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"

      - name: Integration tests — Payment (SQL Server, outbox-in-non-handler wrap)
        if: ${{ !cancelled() }}
        run: >
          dotnet test tests/PaymentService.Tests.Integration/PaymentService.Tests.Integration.csproj
          --logger "trx;LogFileName=payment-integration.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"

      - name: Integration tests — Shipping (Postgres, IDOR + saga handlers)
        if: ${{ !cancelled() }}
        run: >
          dotnet test tests/ShippingService.Tests.Integration/ShippingService.Tests.Integration.csproj
          --logger "trx;LogFileName=shipping-integration.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"

      - name: Publish integration test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Integration Tests
          path: test-results/**/*.trx
          reporter: dotnet-trx

      # Upload integration-layer coverage to Codecov. Flagged "integration" so the
      # dashboard can distinguish unit vs integration contributions. Combined with the
      # "unit" flag from the build job, the overall % reflects what the codebase
      # actually exercises end-to-end (currently ~58% line, ~57% branch per
      # reportgenerator's aggregation in CLAUDE.md).
      - name: Upload integration coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: ./test-results/**/coverage.cobertura.xml
          flags: integration
          fail_ci_if_error: false
          verbose: false
