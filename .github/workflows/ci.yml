name: BUILD_AND_TEST

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# When a PR is updated rapidly, cancel earlier in-flight runs on the same ref —
# only the latest commit matters for merge gating.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write          # test-reporter publishes results as a check run
      pull-requests: write   # ...and annotates the PR

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Cache the NuGet global packages folder keyed on Directory.Packages.props (Central
      # Package Management is our source of truth for versions). Cache hit cuts each run by
      # the cold-restore time (~30-60s on a fresh runner).
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # --logger trx emits machine-readable result files for the reporter step;
      # --collect "XPlat Code Coverage" produces Cobertura XML via Coverlet (ships with
      # the test SDK, no extra package). Both land under ./test-results.
      - name: Test
        run: >
          dotnet test --no-build --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"

      # Surfaces pass/fail counts + failed-test names as a check run in the PR UI,
      # instead of making you scroll the raw job log. Runs even on test failure
      # (that's the case where you most want the report).
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Unit Tests
          path: test-results/**/*.trx
          reporter: dotnet-trx

      # Renders the Cobertura coverage into a markdown table written to the job
      # summary. Measurement, not a gate — tells you what shipped untested.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:'test-results/**/coverage.cobertura.xml' \
            -targetdir:coverage-report \
            -reporttypes:'MarkdownSummaryGithub'
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Concurrency hazard #5 from docs/performance-and-data-correctness.md — the one
      # the build can't catch via analyzers because the distinction between
      # "type-init-immutable lookup table" and "shared mutable state" is structural.
      # Plain List<T>/Dictionary<,>/HashSet<T>/Queue<T>/Stack<T> as static fields are
      # banned wholesale; use ConcurrentDictionary<,>, ImmutableList<T>, FrozenDictionary<,>,
      # or Channel<T> instead. The \b word boundary lets ConcurrentDictionary, ImmutableList,
      # FrozenDictionary pass through.
      - name: Concurrency audit — static mutable collections
        run: |
          if grep -rnE 'static\s+(readonly\s+)?\b(List|Dictionary|HashSet|Queue|Stack)<' \
             --include="*.cs" \
             --exclude-dir=bin --exclude-dir=obj \
             --exclude-dir=Migrations --exclude-dir=tests .; then
            echo "::error::Shared static mutable collection found. Use ConcurrentDictionary / ImmutableList / FrozenDictionary / Channel<T> instead. See docs/performance-and-data-correctness.md 'Concurrency hazards: what the build enforces'."
            exit 1
          fi
