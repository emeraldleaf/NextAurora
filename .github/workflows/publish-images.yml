# Builds and pushes the five service images + the storefront to GHCR, then deploys: an SSH
# step on the VPS runs `docker compose pull && up -d` (docs/full-saga-deployment-plan.md,
# Phase 1 — compose + the box's existing Caddy, revised from Dokploy 2026-08-27). The
# storefront's VITE_* URLs are baked at build time, hence the build-args below.
name: PUBLISH_IMAGES

on:
  push:
    branches: [main]
    paths:
      - "CatalogService/**"
      - "OrderService/**"
      - "PaymentService/**"
      - "ShippingService/**"
      - "NotificationService/**"
      - "frontend/**"
      - "NextAurora.ServiceDefaults/**"
      - "NextAurora.Contracts/**"
      - "Dockerfile.*"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".dockerignore"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, order, payment, shipping, notification, frontend]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/nextaurora-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          # Explicit: the Hetzner VPS is x86-64. Also sidesteps Grpc.Tools' broken
          # linux_arm64 protoc (segfaults compiling catalog.proto in the order image).
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          # Only the frontend consumes these; the .NET images ignore unknown build-args.
          build-args: |
            VITE_CATALOG_API_URL=https://catalog-api.emeraldleaf.dev
            VITE_ORDER_API_URL=https://order-api.emeraldleaf.dev
            VITE_PAYMENT_API_URL=https://payment-api.emeraldleaf.dev
            VITE_KEYCLOAK_URL=https://auth.emeraldleaf.dev

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-vps
    steps:
      - name: Roll the services tier on the VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes root@204.168.183.115 \
            'cd /root/nextaurora && docker compose -f docker-compose.services.yml pull -q && docker compose -f docker-compose.services.yml up -d --remove-orphans && docker image prune -f >/dev/null && docker compose -f docker-compose.services.yml ps --format "{{.Name}} {{.Status}}"'
