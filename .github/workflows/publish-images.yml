# Builds and pushes the five service images + the storefront to GHCR. Deployment is
# PULL-based: a systemd timer on the VPS (/root/nextaurora/deploy.sh, every 3 min) runs
# `docker compose pull && up -d` — the box's SSH allowlist does not (and should not) admit
# GitHub Actions runner IPs, so a push-style SSH deploy job times out. See
# docs/full-saga-deployment-plan.md Phase 1 (revised 2026-08-27). The storefront's VITE_*
# URLs are baked at build time, hence the build-args below.
name: PUBLISH_IMAGES

on:
  push:
    branches: [main]
    paths:
      - "CatalogService/**"
      - "OrderService/**"
      - "PaymentService/**"
      - "ShippingService/**"
      - "NotificationService/**"
      - "frontend/**"
      - "NextAurora.ServiceDefaults/**"
      - "NextAurora.Contracts/**"
      - "Dockerfile.*"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".dockerignore"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, order, payment, shipping, notification, frontend]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/nextaurora-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          # Explicit: the Hetzner VPS is x86-64. Also sidesteps Grpc.Tools' broken
          # linux_arm64 protoc (segfaults compiling catalog.proto in the order image).
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          # Only the frontend consumes these; the .NET images ignore unknown build-args.
          build-args: |
            VITE_CATALOG_API_URL=https://catalog-api.emeraldleaf.dev
            VITE_ORDER_API_URL=https://order-api.emeraldleaf.dev
            VITE_PAYMENT_API_URL=https://payment-api.emeraldleaf.dev
            VITE_KEYCLOAK_URL=https://auth.emeraldleaf.dev
            VITE_TURNSTILE_SITE_KEY=0x4AAAAAAEdYD-Sg868Yp0hr

