# Builds and pushes the five service images to GHCR. Dokploy on the VPS pulls these
# (webhook-triggered) — see docs/full-saga-deployment-plan.md Phases 1-2. The frontend
# image is deferred to Phase 1 (its VITE_* URLs are baked at build time and need the
# deployed environment's hostnames).
name: PUBLISH_IMAGES

on:
  push:
    branches: [main]
    paths:
      - "CatalogService/**"
      - "OrderService/**"
      - "PaymentService/**"
      - "ShippingService/**"
      - "NotificationService/**"
      - "NextAurora.ServiceDefaults/**"
      - "NextAurora.Contracts/**"
      - "Dockerfile.*"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".dockerignore"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, order, payment, shipping, notification]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/nextaurora-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          # Explicit: the Hetzner VPS is x86-64. Also sidesteps Grpc.Tools' broken
          # linux_arm64 protoc (segfaults compiling catalog.proto in the order image).
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
