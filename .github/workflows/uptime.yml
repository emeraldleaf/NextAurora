name: Uptime check (deployed demo)
# Every 30 minutes: TLS-handshake + HTTP on every public hostname of the deployed demo.
# Any failure opens (or updates) a single 'uptime' issue. Added after the 2026-08-28 incident
# where a Riparian redeploy recreated Caddy without the NextAurora import and all five
# hostnames lost TLS for ~12 h — noticed only by a portfolio link check. See docs/deployed-demo.md.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe every public hostname
        id: probe
        shell: bash
        run: |
          set +e
          fail=""
          # hostname → path that must answer over TLS (any HTTP status proves TLS + routing work)
          for target in \
            "shop.emeraldleaf.dev/" \
            "auth.emeraldleaf.dev/realms/nextaurora/.well-known/openid-configuration" \
            "catalog-api.emeraldleaf.dev/scalar/v1" \
            "order-api.emeraldleaf.dev/scalar/v1" \
            "payment-api.emeraldleaf.dev/scalar/v1"; do
            code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "https://$target")
            if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
              fail="$fail\n- https://$target → ${code/000/TLS or connection failure}"
            fi
            echo "$target → $code"
          done
          if [ -n "$fail" ]; then
            printf "failures<<EOF\n%b\nEOF\n" "$fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Open or update the uptime issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURES: ${{ steps.probe.outputs.failures }}
        run: |
          body="Uptime probe failed at $(date -u +'%Y-%m-%d %H:%MZ'):
          $FAILURES

          Runbook: docs/deployed-demo.md → \"Incidents\". First check: \`docker logs deploy-caddy-1\` on the box and whether Caddy lists the NextAurora domains under 'enabling automatic TLS certificate management'."
          existing=$(gh issue list --label uptime --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create uptime --color B60205 --description "Deployed demo is unreachable" 2>/dev/null || true
            gh issue create --title "Uptime: deployed demo unreachable" --label uptime --body "$body"
          fi
