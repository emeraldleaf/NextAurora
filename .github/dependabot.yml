# Auto-PRs for package + workflow-action bumps. Groups keep PR volume manageable —
# minor/patch bumps within a group come as a single PR rather than one per package.
# Security advisories always come as standalone PRs regardless of grouping.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - nuget
    groups:
      # Microsoft.AspNetCore.* transitively depends on Microsoft.EntityFrameworkCore.Relational,
      # so AspNetCore and EF Core CANNOT bump independently — a solo AspNetCore bump pulls a newer
      # EF.Relational and downgrades it against the pinned EF Core → NU1605. Kept as separate
      # groups, this skewed twice (#155, #180) because the two group-PRs merged out of step. One
      # group = one PR = they always move together. (Npgsql EF provider rides along — same cadence.)
      microsoft-aspnet-ef:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.EntityFrameworkCore*"
      wolverine:
        patterns:
          - "WolverineFx*"
      fluent-validation:
        patterns:
          - "FluentValidation*"
      grpc:
        patterns:
          - "Grpc.*"
      testcontainers:
        patterns:
          - "Testcontainers*"
      aspire:
        patterns:
          - "Aspire.*"
      opentelemetry:
        patterns:
          - "OpenTelemetry.*"
      analyzers:
        patterns:
          - "Meziantou.Analyzer"
          - "SonarAnalyzer.*"
          - "Roslynator.*"
          - "Microsoft.CodeAnalysis.*"
      testing:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "AwesomeAssertions"
          - "NSubstitute"
          - "Bogus"
    # Major-version bumps for packages with known migration surface area are
    # deferred — Dependabot shouldn't open a weekly PR that breaks every
    # integration test until someone has time to read the release notes,
    # restructure code, and verify the saga + outbox + concurrency-retry
    # paths still behave. Add majors back to the ignore list as they ship
    # breaking changes; remove when a dedicated migration PR has landed.
    ignore:
      # WolverineFx majors are deferred pending a dedicated migration PR — a
      # major can break host startup or the saga/outbox/concurrency paths, and
      # shouldn't land as an unreviewed weekly bump. The 5→6 migration already
      # landed (#154; RuntimeCompilation split handled, family on 6.17.3), so
      # this now defers 7.0+. Dependabot still bumps 6.x patches/minors (the
      # `wolverine` group above keeps the whole family in step).
      - dependency-name: "WolverineFx*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
