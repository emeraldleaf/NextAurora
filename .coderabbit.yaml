# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for NextAurora.
# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit
#
# Philosophy: CodeRabbit is the *second* reviewer (after the architecture-reviewer agent
# and the local build/analyzer pass). It catches what those miss — cross-file consistency,
# subtle naming drift, missing test coverage on new logic. Tuned to be opinionated about
# THIS project's conventions (loaded from CLAUDE.md), not generic .NET nits.

language: en

reviews:
  # Profile "assertive" surfaces more findings; "chill" only flags clear issues. Assertive
  # is the right choice given this repo demonstrates AI workflow rigor — over-flagging is
  # acceptable, missed real issues are not.
  profile: assertive

  # Request changes when blocking issues are found, instead of approving with comments.
  request_changes_workflow: true

  # Generate a high-level summary as the PR description if missing.
  high_level_summary: true
  high_level_summary_in_walkthrough: false

  # Auto-generate a poem? No. Wastes reviewer attention.
  poem: false

  # Walkthrough section: ON. Useful for reviewers to orient before reading the diff.
  collapse_walkthrough: false

  # Tell CodeRabbit what THIS project values. The instructions here are the bridge between
  # CLAUDE.md (which CodeRabbit doesn't load automatically) and the review pass.
  path_instructions:
    - path: "**/*.cs"
      instructions: |
        Apply CLAUDE.md "Architecture Principles" (SOLID, DDD, layer dependencies) and
        "Performance Rules" (project-in-EF for reads — NOT entity-then-map-in-memory,
        await everywhere on request paths, CancellationToken propagation, pagination
        caps at 100, optimistic concurrency tokens on aggregates, outbox atomicity).
        File-scoped namespaces required. Async methods MUST be suffixed Async and called
        HandleAsync (NOT Handle). Private instance fields prefixed with _; constants and
        static readonly use PascalCase. Sync-over-async patterns (.Result, .Wait(),
        .GetAwaiter().GetResult()) are banned at build time — flag any sneak-through.
        Interfaces earn their keep through consumer substitution (test mock or 2+ impls
        today, OR concrete near-term roadmap) — flag speculative interfaces. Repository
        wrappers around EF Core (IFooRepository + FooRepository) are explicitly NOT
        justified by the substitution rule — see the "**/Domain/I*Repository.cs"
        path_instructions below. No service has repository implementations anymore
        (they were all retired in the simplicity refactor + CatalogService VSA collapse),
        so a separate "**/Infrastructure/*Repository.cs" rule is unnecessary.

    - path: "**/Features/**/*.cs"
      instructions: |
        This is a VSA service. The file should be a single vertical slice: command/query
        record + validator + handler, co-located. If multiple feature concerns are
        appearing in one file, flag the split. Handlers take CancellationToken and return
        Task<T>. Use primary-constructor DI. Look at OrderService/Features/PlaceOrder.cs
        for the canonical shape including Tier-1 teaching comments.

        DATA-ACCESS SHAPE: handlers take the DbContext (e.g. OrderDbContext) directly,
        NOT a wrapper repository interface. Reads: handler runs the IQueryable inline
        with AsNoTracking() + .Select(...) projection to DTO. Writes: handler loads the
        tracked aggregate via context.Foo.Include(...).FirstOrDefaultAsync(...), calls
        the aggregate's state-transition method, then context.SaveChangesAsync(ct).
        AutoApplyTransactions wraps the SaveChanges + Wolverine outbox staging in one
        DB transaction. Flag any handler that takes an IFooRepository dependency, or
        any new IFooRepository interface introduced — those are wrapper-around-EF
        patterns the project removed (see CLAUDE.md "Data access: DbContext directly").

        NON-SARGABLE PREDICATES (Must-fix). A `Where(...)` that wraps an entity column
        in a function — `u.Email.ToLower() == x`, `o.CreatedAt.Date == today`, or
        `EF.Functions.ILike(p.Name, "%text%")` with a leading wildcard — defeats any
        B-tree index on that column. The planner falls back to a full scan even when
        an index exists. Fix at write time: normalize on insert/update (e.g.
        `EmailNormalized` column populated by the aggregate factory) and `Where`
        against the normalized column; or use case-insensitive column collation.
        Leading-wildcard substring search isn't B-tree-indexable in any database —
        escalate to Postgres `tsvector` full-text search or a dedicated search engine
        (Elasticsearch/OpenSearch/Meilisearch) when load justifies it. Reference
        example with the trade-off documented in the file:
        CatalogService/Features/SearchProducts.cs (leading wildcard intentional;
        full-text is the named next step). The deeper principle: indexes carry a
        write cost — every insert/update touches every index — so an index the
        planner can't use is pure overhead. See CLAUDE.md "Non-sargable predicates
        defeat indexes — fix at write time, not at read time".

        PARALLEL INDEPENDENT AWAITS (Should-consider on sequential awaits of independent
        I/O). When a handler makes N independent I/O calls (N gRPC requests to
        different services, N HTTP calls to different external APIs, N queries against
        DIFFERENT DbContexts), sequential `await`s pay the sum of latencies; the right
        shape is `Task.WhenAll`. Recommend `Task.WhenAll` when you see three or more
        sequential awaits whose results don't feed each other. Reference shape:
        OrderService/Features/PlaceOrder.cs:93 (Task.WhenAll over per-line
        catalogClient.GetProductAsync — gRPC fan-out, no shared mutable state).

        DO NOT recommend Task.WhenAll when: (a) the operations are dependent (output
        of one feeds input of another), (b) they share the same EF DbContext scope
        (DbContext is NOT thread-safe — parallel EF queries against the same context
        throw or corrupt state; use IDbContextFactory<T> for parallel EF queries),
        or (c) failure observability matters per-operation (Task.WhenAll surfaces only
        the first exception). See CLAUDE.md "Parallelize independent awaits with
        Task.WhenAll" + the existing "DbContext is not thread-safe" rule.

        FAN-OUT SHAPE (Must-fix on synchronous in-handler loops over recipients).
        A handler that iterates a recipient list inline and `await`s a sender per
        recipient (`foreach (var follower in followers) await _sender.SendAsync(...)`)
        holds the request open for N × per-recipient-latency and creates traffic
        spikes that starve the rest of the system. The right shape: publish one
        Wolverine message per recipient (or per batch of K), return immediately,
        let per-recipient handlers run in parallel under Wolverine's
        `MaxDegreeOfParallelism` throttle. Not retroactively violated today
        (NotificationService consumes one event = one outbound notification), but
        the rule is preventative for any future broadcast-to-N feature. See
        CLAUDE.md "Fan-out belongs on the message bus, not in a synchronous
        handler loop".

    - path: "**/Domain/I*Repository.cs"
      instructions: |
        Repository interfaces wrapping EF Core (e.g. IOrderRepository, IPaymentRepository)
        were removed from this project in the simplicity refactor. Handlers take
        DbContext directly because DbContext IS Unit-of-Work and DbSet<T> IS Repository
        — wrapping them adds layers without capability. The unit-test-mocking
        justification was replaced by integration tests with Testcontainers (see the
        Testing rule in CLAUDE.md).

        Flag any new file matching this glob. There are two acceptable interface ports
        that REMAIN in Domain folders today and don't fit this rule: IEventPublisher
        (Wolverine vs. test fake) and ICatalogClient (gRPC vs. test fake). Those have
        legitimate substitution stories. Anything ending in "Repository" doesn't.

    - path: "CatalogService/**/*.cs"
      instructions: |
        CatalogService is now Vertical Slice Architecture like the other four services —
        the Clean Architecture four-project split was retired in the VSA-collapse
        refactor. Single CatalogService.csproj at the service root; Features/ holds the
        co-located command/query + validator + handler files; Domain/ holds aggregates
        (Product, Category) and the IProductCache port; Infrastructure/ holds
        CatalogDbContext + HybridProductCache + migrations + DI; Endpoints/ and Grpc/
        hold the HTTP and gRPC surfaces.

        DATA-ACCESS SHAPE: handlers take CatalogDbContext directly. There is NO
        IProductRepository or IProductReadStore — read handlers project inline via
        AsNoTracking() + .Select(...) into ProductDto; write handlers load the
        aggregate tracked, mutate via state-transition methods (Product.UpdateDetails,
        Product.AdjustStock), and call SaveChangesAsync. Flag any new I*Repository
        introduced in this service — that pattern was removed for the same reason it
        was removed from the other four services (DbContext IS Unit-of-Work, DbSet<T>
        IS Repository; mocking has been replaced by integration tests with Testcontainers
        in CatalogService.Tests.Integration). See CLAUDE.md "Data access: DbContext
        directly, no repository wrappers".

        DOMAIN INVARIANTS: Domain entities use factory methods (static Create()) with
        validation, never public setters. Currency must be 3 chars; Price > 0; stock
        non-negative.

        ENTITY ID GENERATION (Should-consider on new aggregate factory using
        Guid.NewGuid()). Aggregate factory methods (`static Create()` on Order,
        Payment, Shipment, Product, Category, etc.) should mint entity IDs with
        `Guid.CreateVersion7()`, not `Guid.NewGuid()`. UUID v7 is time-ordered
        (first 48 bits = Unix-ms timestamp), so PK inserts append-extend the
        B-tree index instead of fragmenting it. .NET 9+ API, same `Guid` type,
        no third-party package needed.

        Trade-off worth flagging: v7's timestamp is decodable from the ID, so
        the mint time leaks to anyone holding it. Acceptable for buyer-scoped
        resources (IDOR-gated) and naturally-timestamped public resources
        (Product creation time isn't sensitive). DO NOT use v7 for IDs where
        the mint time IS sensitive (security tokens, admin-only references) —
        in those cases keep `Guid.NewGuid()` and note the reason inline.

        Don't recommend a sweep of existing `Guid.NewGuid()` call sites — the
        rule applies opportunistically to new aggregate code; existing v4 IDs
        in the DB coexist fine with new v7 IDs (same column, no migration).

        See CLAUDE.md "Performance Rules → Entity IDs use Guid.CreateVersion7()".

    - path: "**/Infrastructure/DependencyInjection.cs"
      instructions: |
        Port registrations. Flag two distinct patterns:

        1) PREMATURE FACTORY (Must-fix). A `services.AddKeyedScoped<IPort, OnlyImpl>(key)`
           or an `IPortFactory` registration with only one impl in the file is the same
           speculative coupling as the deleted I*Repository wrappers — a layer that
           adds no capability today and isn't shaped for whatever the second impl
           actually needs. The right shape for a single-impl port is the plain
           `services.AddScoped<IPort, OnlyImpl>()`. Recommend deleting the factory/key
           setup until a second impl actually ships.

        2) MISSING FACTORY when 2+ impls exist with per-call selection (Must-fix).
           If the same port has multiple AddScoped<IPort, ...> registrations AND
           per-call routing is intended (e.g. ConsoleNotificationSender +
           SendGridNotificationSender both registered the same way, and
           request.Channel is supposed to decide which one runs), the impls collide
           silently — DI returns the last-registered impl deterministically for
           every call, dropping the routing intent and producing a latent bug, not
           a style nit. The fix is .NET keyed services: AddKeyedScoped<IPort,
           Impl1>("k1") + AddKeyedScoped<IPort, Impl2>("k2"), resolved in the
           handler via `[FromKeyedServices(key)] IPort sender` parameter. Do NOT
           introduce a hand-rolled IPortFactory interface — `IServiceProvider.
           GetRequiredKeyedService` is the canonical factory, and an extra wrapper
           is the same layer-without-capability as the deleted repositories.

           If the two impls are genuinely interchangeable (either would satisfy
           any call — e.g. redundant logging targets), Should-consider rather
           than Must-fix: still tighten to keyed services for explicitness, but
           it's not a live bug.

        Reference example: NotificationService is "ready for the factory, not yet
        wearing it." INotificationSender exists (single impl ConsoleNotificationSender
        today); SendNotificationRequest.Channel already carries the routing key for
        the day a second adapter ships. When that day comes, this file becomes the
        natural site of the keyed-services rewrite.

        See CLAUDE.md "Interfaces earn their keep through consumer substitution".

    - path: "**/Endpoints/**/*.cs"
      instructions: |
        Every endpoint must use MapV1ApiGroup(tag, name) from NextAurora.ServiceDefaults —
        never hand-roll NewVersionedApi().MapGroup().HasApiVersion() chains. All non-public
        endpoints get .RequireAuthorization(). All list endpoints paginate (cap 100). All
        error responses go through GlobalExceptionHandler — never expose internal state,
        entity IDs, or stack traces to clients.

        IDOR PREVENTION (highest-stakes finding category for this repo): every endpoint that
        returns OR mutates a scoped entity (Order, Payment, Shipment, Product update, etc.)
        must enforce scope. The canonical shape:
          1. Endpoint reads ClaimTypes.NameIdentifier from JWT → requestingBuyerId/sellerId
          2. Query/command carries the requesting principal as a field (NOT trusted from body)
          3. Handler compares entity.BuyerId/SellerId to request.RequestingBuyerId/SellerId
          4. Handler returns null on mismatch; endpoint translates null → 404 (NOT 403 —
             403 leaks existence, 404 is indistinguishable from "not found")
        Flag any GET-by-id, GET-by-scope, PATCH, PUT, or DELETE endpoint missing this pattern.
        Reference templates: OrderEndpoints.cs:GET /orders/{id}, ShippingEndpoints.cs:GET
        /shipments/order/{orderId}, CatalogEndpoints.cs:PUT /products/{id} (seller variant).

        LONG-RUNNING WORK — 202 ACCEPTED SHAPE (Must-fix on minutes-scale handlers,
        Should-consider on >1s handlers). If a write endpoint synchronously awaits
        something that can take more than ~1 second — multi-step external API chain
        (e.g. Stripe + tax calc + fraud check sequentially), aggregation over
        thousands of rows, bulk import, report generation — it's the wrong shape.
        Reshape as 202 Accepted: validate + persist a tracking row + publish a
        Wolverine message + return `202` with the job/correlation ID in the body
        and a `Location` header pointing to a status endpoint. A background handler
        does the actual work; the client polls or receives a push (SignalR/SSE/email).
        The synchronous parts (validate, persist intent, stage envelope) commit in
        one EF transaction via AutoApplyTransactions.

        NextAurora already has the full infrastructure for this — Wolverine +
        Service Bus + outbox + saga handlers — so the rule is "use it when a
        handler would otherwise block on minutes-scale work." Reference shape:
        POST /api/v1/orders (place → publish OrderPlaced → return OrderId
        immediately; PaymentService + ShippingService handle the downstream
        work via the saga). The same rule applies to Wolverine handlers
        themselves: if a handler body runs for minutes, the work belongs in a
        follow-up message handler, not in-line.

        See CLAUDE.md "Performance Rules → Long-running work belongs on the
        message bus, not the synchronous HTTP handler".

        RATE-LIMIT SHAPE (Should-consider on single-instance, Must-fix on
        multi-instance scale). ASP.NET Core's built-in RequireRateLimiting +
        AddFixedWindowLimiter / AddSlidingWindowLimiter store counters
        in-process — correct for single-instance deployment, but the limit
        silently multiplies by N when scaled to N instances (each instance
        enforces its own counter, a client hitting any instance gets a fresh
        allowance). NextAurora is single-instance everywhere today so the
        in-memory limiter is correct.

        Flag two scenarios:
        1. A new `RequireRateLimiting` on an endpoint without a comment at the
           call site or registration site (`AddFixedWindowLimiter` /
           `AddSlidingWindowLimiter` in `Program.cs`) justifying why in-memory
           is correct for current scale + naming the swap-to-Redis trigger.
        2. A deployment-config PR (`Dockerfile.*`, `fly.toml`, GitHub Actions
           deploy workflow) that scales a rate-limited service past 1 Machine
           without a paired swap to a Redis-backed limiter.

        The fix when scale-out happens: Redis-backed limiter using the
        existing HybridCache Redis. The increment + TTL pair (INCR then
        EXPIRE) has a race window under concurrency — wrap in a Lua script
        via EVAL so the operation is atomic.

        See CLAUDE.md "Security Requirements → Rate Limiting" +
        docs/full-saga-deployment-plan.md Phase 3 audit deliverable.

    - path: "**/*RecoveryJob*.cs"
      instructions: |
        BackgroundService sweepers + recovery jobs run OUTSIDE Wolverine's handler pipeline,
        so AutoApplyTransactions does NOT wrap them. The outbox-atomicity trap: PublishAsync
        stages an envelope to the tracker, but it's only persisted when SaveChangesAsync runs.
        If a wrapper does BeginTransactionAsync → entity write + publish → Commit *without*
        an explicit SaveChangesAsync between publish and commit, the staged envelope never
        reaches wolverine.outgoing_envelopes — event is silently dropped, saga stalls.

        Flag any non-handler code path that publishes events without an explicit
        SaveChangesAsync after the publish and before the transaction commit. Reference:
        PaymentRepository.ExecuteInTransactionAsync (canonical safe wrapper).

        Also: BackgroundService sweepers should create a fresh DI scope per iteration of
        their sweep loop, NOT reuse one scope across the whole sweep — change tracker
        bloat for the duration of the sweep + future parallel-refactor footgun.

    - path: "NextAurora.ServiceDefaults/**/*.cs"
      instructions: |
        Security-critical infrastructure. Specific things to flag:

        - HTTP middleware order in MapDefaultEndpoints must be:
            UseExceptionHandler → UseAuthentication → CorrelationIdMiddleware → UseAuthorization
          CorrelationIdMiddleware MUST run after UseAuthentication (else context.User is empty
          and UserId scope is always null) AND before UseAuthorization (so 401/403 denials
          get UserId in their log scope for audit). Any other ordering is a regression.

        - JWT TokenValidationParameters must explicitly set:
            ValidateIssuerSigningKey = true
            ClockSkew = TimeSpan.FromSeconds(30)   // NOT the 5-minute default
            ValidateAudience/Issuer/Lifetime = true
          Default ClockSkew (5 min) makes revoked tokens valid for 5 extra minutes —
          material on short-lived access tokens.

        - GlobalExceptionHandler must use Activity.Current?.TraceId.ToString() (32 hex chars),
          NOT Activity.Current?.Id (the full W3C traceparent with span — leaks server-side
          call structure to clients).

        - Tests: changes to this project warrant unit-test coverage of the changed lines.
          ServiceDefaults has historically been undertested; bumping coverage of new lines is
          worth the small effort to keep codecov/patch from regressing repo-wide.

    - path: "**/*Migration*.cs"
      instructions: |
        EF Core migrations are IMMUTABLE once applied anywhere (dev included). Never edit
        an existing migration. Destructive changes (drop column/table, rename, NOT NULL on
        existing column) need a multi-step plan, not a single migration. Flag any edit to
        an existing migration file.

    - path: "**/*Test*.cs"
      instructions: |
        Integration tests are the DEFAULT for handler tests. Use Testcontainers (real
        Postgres/SQL Server/Redis/ASB-stub) via WebApplicationFactory<Program>. The pattern
        for "is this handler correct" is hit the API → assert DB state + Wolverine.Tracking
        envelopes, NOT mock a repository and verify call counts. Unit tests are reserved
        for PURE domain logic — Order.MarkAsPaid() state guards, FluentValidation rules,
        DTO-only operations — anything that doesn't touch DbContext or external IO. If
        a unit test reaches for Substitute.For<IFooRepository>, the test belongs in the
        integration project; flag it. NSubstitute is still the tool for substitution of
        the legitimate ports (IEventPublisher, ICatalogClient, IPaymentGateway,
        INotificationSender, IProductCache, IProductReadStore). AwesomeAssertions (not
        FluentAssertions) for assertions across both unit and integration tiers.

        HANDLER-DI REGISTRATION RULE (CLAUDE.md "Communication Patterns → Wolverine
        handler discovery is NOT DI registration"): Wolverine's `opts.Discovery` builds
        an INTERNAL message-type → handler-type map for `IMessageBus` dispatch. It does
        NOT register handler types in `IServiceCollection`. Therefore, any integration
        test that resolves a handler directly via `serviceProvider.GetRequiredService<T>()`
        REQUIRES an explicit `services.AddScoped<T>()` in the service's
        `AddXInfrastructure` registration — otherwise the test throws
        `InvalidOperationException: No service for type 'X.Handler' has been registered`
        at first run.

        Flag PRs that:
          - Add a test calling `GetRequiredService<*Handler>()` (or
            `GetService<*Handler>()`) WITHOUT a corresponding `AddScoped<*Handler>()`
            in the same diff. Reference the failure mode that surfaced this rule:
            OrderReadProjectionTests broke in CI after the repository-wrapper refactor
            because the handler-resolved tests assumed handlers were DI-registered.
          - Remove an `AddScoped<*Handler>()` line in DependencyInjection.cs WITHOUT
            removing the corresponding integration-test resolution — the test silently
            keeps compiling and fails at runtime.

        Going through the HTTP endpoint (`HttpClient` in the WebApplicationFactory) is
        always safe — that path uses `IMessageBus` and never hits this trap. The direct
        `GetRequiredService<Handler>()` shape is reserved for read-handler projection
        tests where booting auth + HTTP would be over-scoped for asserting the EF SQL.

        TEST STRUCTURE — AAA WITH NARRATIVE COMMENTS (canonical per CLAUDE.md "Testing"):
        Every test must follow the Arrange → Act → Assert structure with `// ARRANGE`,
        `// ACT`, `// ASSERT` markers (all caps; em-dash explanation on the same line is
        the convention). Each phase carries a *story comment*: what's being set up and
        WHY, what's being called, and what each assertion verifies. A junior dev should
        be able to read a single test top-to-bottom and understand the contract +
        failure mode without needing to read the SUT first.

        When the ASSERT phase verifies multiple invariants, number them and explain
        why each matters — especially for:
          - Security boundaries (IDOR / ownership checks): explain that returning null →
            404 is intentional (not 403), to avoid leaking existence.
          - Idempotency guards under at-least-once delivery: explain that a no-op (not a
            throw) keeps the message off the DLQ for benign late deliveries.
          - Ordering-sensitive operations (cache invalidate AFTER save): explain the race
            window the ordering protects against.

        Trivial happy-path tests can be shorter; security/concurrency/idempotency tests
        get the full story. Flag tests that:
          - Use lowercase `// arrange` markers or omit them entirely.
          - Have ASSERT phases with multiple invariants and no rationale.
          - Test a security/idempotency/ordering invariant without explaining the
            failure mode being guarded against.

        Reference templates:
          - tests/CatalogService.Tests.Unit/Application/UpdateProductHandlerTests.cs
            (security boundary + cache-after-save ordering)
          - tests/OrderService.Tests.Unit/Application/PaymentFailedHandlerTests.cs
            (idempotency under at-least-once delivery)
          - tests/ShippingService.Tests.Unit/Application/GetShipmentByOrderHandlerTests.cs
            (IDOR-prevention pattern with null → 404)

    - path: "CLAUDE.md"
      instructions: |
        This is the canonical rules file. When this changes, every paraphrase ending in
        "See CLAUDE.md" elsewhere in the repo may need updating. Flag the CLAUDE.md
        change with a note: "Run /check-rules locally to audit paraphrases against this
        diff."

    - path: "docs/STATUS.md"
      instructions: |
        STATUS.md is the cross-session entry point. When this changes, the "Last updated:"
        date should be today. Flag if the date is stale relative to the diff.

    - path: ".github/workflows/*.yml"
      instructions: |
        GitHub Actions in this repo are version-pinned (@vN), NOT SHA-pinned, by
        deliberate convention. Per docs/dev-loop.md "Gap 4 — GitHub Actions
        version-pinned, not SHA-pinned", SHA-pinning is deferred to a single
        workflow-wide hardening pass using pin-github-action — NOT done per
        individual workflow PR. Pinning one workflow while six others remain on
        floating tags creates inconsistency theater. Do NOT flag individual
        actions/checkout@v6, actions/setup-dotnet@v5, etc. as "unpinned" on
        new workflows. The hardening pass will pin all actions at once.

        Bracket spacing in `branches: [ main ]` matches the existing repo
        convention (ci.yml, codeql.yml). Don't flag `[ main ]` → `[main]`
        style nits — uniformity across the five workflows matters more than
        either bracket style individually.

        DO flag: missing `persist-credentials: false` on actions/checkout when
        the job doesn't push back to the repo, missing `set -euo pipefail`
        in bash run blocks, missing `permissions:` blocks, missing
        `concurrency:` groups, secrets in plaintext, hardcoded tokens.

# Chat: allow @coderabbitai mentions to ask follow-up questions on a PR.
chat:
  auto_reply: true

# Knowledge base: feed CodeRabbit relevant docs so its review reasoning uses project
# context, not generic .NET assumptions.
knowledge_base:
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  pull_requests:
    scope: "auto"
