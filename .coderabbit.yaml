# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for NextAurora.
# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit
#
# Philosophy: CodeRabbit is the *second* reviewer (after the architecture-reviewer agent
# and the local build/analyzer pass). It catches what those miss — cross-file consistency,
# subtle naming drift, missing test coverage on new logic. Tuned to be opinionated about
# THIS project's conventions (loaded from CLAUDE.md), not generic .NET nits.

language: en

reviews:
  # Profile "assertive" surfaces more findings; "chill" only flags clear issues. Assertive
  # is the right choice given this repo demonstrates AI workflow rigor — over-flagging is
  # acceptable, missed real issues are not.
  profile: assertive

  # Request changes when blocking issues are found, instead of approving with comments.
  request_changes_workflow: true

  # Generate a high-level summary as the PR description if missing.
  high_level_summary: true
  high_level_summary_in_walkthrough: false

  # Auto-generate a poem? No. Wastes reviewer attention.
  poem: false

  # Walkthrough section: ON. Useful for reviewers to orient before reading the diff.
  collapse_walkthrough: false

  # Tell CodeRabbit what THIS project values. The instructions here are the bridge between
  # CLAUDE.md (which CodeRabbit doesn't load automatically) and the review pass.
  path_instructions:
    - path: "**/*.cs"
      instructions: |
        Apply CLAUDE.md "Architecture Principles" (SOLID, DDD, layer dependencies) and
        "Performance Rules" (project-in-EF for reads — NOT entity-then-map-in-memory,
        await everywhere on request paths, CancellationToken propagation, pagination
        caps at 100, optimistic concurrency tokens on aggregates, outbox atomicity).
        File-scoped namespaces required. Async methods MUST be suffixed Async and called
        HandleAsync (NOT Handle). Private instance fields prefixed with _; constants and
        static readonly use PascalCase. Sync-over-async patterns (.Result, .Wait(),
        .GetAwaiter().GetResult()) are banned at build time — flag any sneak-through.
        Interfaces earn their keep through consumer substitution (test mock or 2+ impls
        today, OR concrete near-term roadmap) — flag speculative interfaces.

    - path: "**/Features/**/*.cs"
      instructions: |
        This is a VSA service. The file should be a single vertical slice: command/query
        record + validator + handler, co-located. If multiple feature concerns are
        appearing in one file, flag the split. Handlers take CancellationToken and return
        Task<T>. Use primary-constructor DI. Look at OrderService/Features/PlaceOrder.cs
        for the canonical shape including Tier-1 teaching comments.

        READ-PATH SHAPE (VSA variant): query handlers call a sibling DTO-returning
        method on the existing repository (e.g. IOrderRepository.GetSummaryByIdAsync
        returning OrderSummaryDto?) — NOT GetByIdAsync returning the entity followed by
        an in-memory Mapper.ToDto() pass. The DTO-returning method projects in EF
        (.AsNoTracking().Select(o => new OrderSummaryDto { ... })). The entity-returning
        method stays for saga/command paths that mutate the aggregate. Flag any read
        handler that loads a domain entity and maps in memory — the canonical fix is to
        add a sibling repo method and switch the handler. Reference: GetOrdersByBuyer.cs.

    - path: "**/Infrastructure/*Repository.cs"
      instructions: |
        CQRS read/write split is the rule, not a future cleanup (see
        docs/cqrs-data-access.md). Repository methods divide into:
          - Write-path loaders (e.g. GetByIdAsync returning Order/Shipment/Payment):
            tracking ON, Include navigation children needed for the mutation, callers
            mutate via aggregate methods and SaveChanges.
          - Read-path projections (e.g. GetSummaryByIdAsync returning OrderSummaryDto):
            AsNoTracking() + .Select(...) to DTO inside the IQueryable, returns the DTO
            directly. NO entity materialization, NO in-memory mapper, NO calling
            Mapper.ToDto(entity).

        Flag any new or modified repository method that materializes a domain entity
        for a caller that then maps to DTO in memory. The fix is to project in EF and
        return the DTO. The only exception is methods on the WRITE path where the
        caller actually mutates the loaded aggregate.

        Methods on a read path that use AsNoTracking() but still return an entity
        type are a half-fix — flag them too. The signature itself should be the proof
        of intent: read paths return DTOs.

    - path: "CatalogService/**/*.cs"
      instructions: |
        This service uses Clean Architecture (Domain / Application / Infrastructure / Api).
        Domain depends on nothing; Application on Domain; Infrastructure on both; Api is
        the composition root. Flag any cross-layer leak. Domain entities use factory
        methods (static Create()) with validation, never public setters.

        READ-PATH SHAPE (Clean variant): query handlers depend on IProductReadStore
        (or sibling IFooReadStore) defined in CatalogService.Application/Interfaces/,
        implementation in CatalogService.Infrastructure/Repositories/. The read store
        returns DTOs by projecting in EF (.AsNoTracking().Select(p => new ProductDto {...})).
        Domain-layer IProductRepository stays entity-returning for the write path only —
        adding a DTO-returning method there would force a Domain → Contracts dependency,
        breaking layer rules. Flag any CatalogService query handler that calls
        IProductRepository for a read instead of IProductReadStore. See
        docs/cqrs-data-access.md for the full pattern.

    - path: "**/Endpoints/**/*.cs"
      instructions: |
        Every endpoint must use MapV1ApiGroup(tag, name) from NextAurora.ServiceDefaults —
        never hand-roll NewVersionedApi().MapGroup().HasApiVersion() chains. All non-public
        endpoints get .RequireAuthorization(). All list endpoints paginate (cap 100). All
        error responses go through GlobalExceptionHandler — never expose internal state,
        entity IDs, or stack traces to clients.

        IDOR PREVENTION (highest-stakes finding category for this repo): every endpoint that
        returns OR mutates a scoped entity (Order, Payment, Shipment, Product update, etc.)
        must enforce scope. The canonical shape:
          1. Endpoint reads ClaimTypes.NameIdentifier from JWT → requestingBuyerId/sellerId
          2. Query/command carries the requesting principal as a field (NOT trusted from body)
          3. Handler compares entity.BuyerId/SellerId to request.RequestingBuyerId/SellerId
          4. Handler returns null on mismatch; endpoint translates null → 404 (NOT 403 —
             403 leaks existence, 404 is indistinguishable from "not found")
        Flag any GET-by-id, GET-by-scope, PATCH, PUT, or DELETE endpoint missing this pattern.
        Reference templates: OrderEndpoints.cs:GET /orders/{id}, ShippingEndpoints.cs:GET
        /shipments/order/{orderId}, CatalogEndpoints.cs:PUT /products/{id} (seller variant).

    - path: "**/*RecoveryJob*.cs"
      instructions: |
        BackgroundService sweepers + recovery jobs run OUTSIDE Wolverine's handler pipeline,
        so AutoApplyTransactions does NOT wrap them. The outbox-atomicity trap: PublishAsync
        stages an envelope to the tracker, but it's only persisted when SaveChangesAsync runs.
        If a wrapper does BeginTransactionAsync → entity write + publish → Commit *without*
        an explicit SaveChangesAsync between publish and commit, the staged envelope never
        reaches wolverine.outgoing_envelopes — event is silently dropped, saga stalls.

        Flag any non-handler code path that publishes events without an explicit
        SaveChangesAsync after the publish and before the transaction commit. Reference:
        PaymentRepository.ExecuteInTransactionAsync (canonical safe wrapper).

        Also: BackgroundService sweepers should create a fresh DI scope per iteration of
        their sweep loop, NOT reuse one scope across the whole sweep — change tracker
        bloat for the duration of the sweep + future parallel-refactor footgun.

    - path: "NextAurora.ServiceDefaults/**/*.cs"
      instructions: |
        Security-critical infrastructure. Specific things to flag:

        - HTTP middleware order in MapDefaultEndpoints must be:
            UseExceptionHandler → UseAuthentication → CorrelationIdMiddleware → UseAuthorization
          CorrelationIdMiddleware MUST run after UseAuthentication (else context.User is empty
          and UserId scope is always null) AND before UseAuthorization (so 401/403 denials
          get UserId in their log scope for audit). Any other ordering is a regression.

        - JWT TokenValidationParameters must explicitly set:
            ValidateIssuerSigningKey = true
            ClockSkew = TimeSpan.FromSeconds(30)   // NOT the 5-minute default
            ValidateAudience/Issuer/Lifetime = true
          Default ClockSkew (5 min) makes revoked tokens valid for 5 extra minutes —
          material on short-lived access tokens.

        - GlobalExceptionHandler must use Activity.Current?.TraceId.ToString() (32 hex chars),
          NOT Activity.Current?.Id (the full W3C traceparent with span — leaks server-side
          call structure to clients).

        - Tests: changes to this project warrant unit-test coverage of the changed lines.
          ServiceDefaults has historically been undertested; bumping coverage of new lines is
          worth the small effort to keep codecov/patch from regressing repo-wide.

    - path: "**/*Migration*.cs"
      instructions: |
        EF Core migrations are IMMUTABLE once applied anywhere (dev included). Never edit
        an existing migration. Destructive changes (drop column/table, rename, NOT NULL on
        existing column) need a multi-step plan, not a single migration. Flag any edit to
        an existing migration file.

    - path: "**/*Test*.cs"
      instructions: |
        Integration tests use Testcontainers with real DB / messaging — never mocks for
        infrastructure. Unit tests use NSubstitute for ports (IRepository, IEventPublisher,
        etc.). AwesomeAssertions (not FluentAssertions) for assertions.

        TEST STRUCTURE — AAA WITH NARRATIVE COMMENTS (canonical per CLAUDE.md "Testing"):
        Every test must follow the Arrange → Act → Assert structure with `// ARRANGE`,
        `// ACT`, `// ASSERT` markers (all caps; em-dash explanation on the same line is
        the convention). Each phase carries a *story comment*: what's being set up and
        WHY, what's being called, and what each assertion verifies. A junior dev should
        be able to read a single test top-to-bottom and understand the contract +
        failure mode without needing to read the SUT first.

        When the ASSERT phase verifies multiple invariants, number them and explain
        why each matters — especially for:
          - Security boundaries (IDOR / ownership checks): explain that returning null →
            404 is intentional (not 403), to avoid leaking existence.
          - Idempotency guards under at-least-once delivery: explain that a no-op (not a
            throw) keeps the message off the DLQ for benign late deliveries.
          - Ordering-sensitive operations (cache invalidate AFTER save): explain the race
            window the ordering protects against.

        Trivial happy-path tests can be shorter; security/concurrency/idempotency tests
        get the full story. Flag tests that:
          - Use lowercase `// arrange` markers or omit them entirely.
          - Have ASSERT phases with multiple invariants and no rationale.
          - Test a security/idempotency/ordering invariant without explaining the
            failure mode being guarded against.

        Reference templates:
          - tests/CatalogService.Tests.Unit/Application/UpdateProductHandlerTests.cs
            (security boundary + cache-after-save ordering)
          - tests/OrderService.Tests.Unit/Application/PaymentFailedHandlerTests.cs
            (idempotency under at-least-once delivery)
          - tests/ShippingService.Tests.Unit/Application/GetShipmentByOrderHandlerTests.cs
            (IDOR-prevention pattern with null → 404)

    - path: "CLAUDE.md"
      instructions: |
        This is the canonical rules file. When this changes, every paraphrase ending in
        "See CLAUDE.md" elsewhere in the repo may need updating. Flag the CLAUDE.md
        change with a note: "Run /check-rules locally to audit paraphrases against this
        diff."

    - path: "docs/STATUS.md"
      instructions: |
        STATUS.md is the cross-session entry point. When this changes, the "Last updated:"
        date should be today. Flag if the date is stale relative to the diff.

    - path: ".github/workflows/*.yml"
      instructions: |
        GitHub Actions in this repo are version-pinned (@vN), NOT SHA-pinned, by
        deliberate convention. Per docs/dev-loop.md "Gap 4 — GitHub Actions
        version-pinned, not SHA-pinned", SHA-pinning is deferred to a single
        workflow-wide hardening pass using pin-github-action — NOT done per
        individual workflow PR. Pinning one workflow while six others remain on
        floating tags creates inconsistency theater. Do NOT flag individual
        actions/checkout@v6, actions/setup-dotnet@v5, etc. as "unpinned" on
        new workflows. The hardening pass will pin all actions at once.

        Bracket spacing in `branches: [ main ]` matches the existing repo
        convention (ci.yml, codeql.yml). Don't flag `[ main ]` → `[main]`
        style nits — uniformity across the five workflows matters more than
        either bracket style individually.

        DO flag: missing `persist-credentials: false` on actions/checkout when
        the job doesn't push back to the repo, missing `set -euo pipefail`
        in bash run blocks, missing `permissions:` blocks, missing
        `concurrency:` groups, secrets in plaintext, hardcoded tokens.

# Chat: allow @coderabbitai mentions to ask follow-up questions on a PR.
chat:
  auto_reply: true

# Knowledge base: feed CodeRabbit relevant docs so its review reasoning uses project
# context, not generic .NET assumptions.
knowledge_base:
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  pull_requests:
    scope: "auto"
