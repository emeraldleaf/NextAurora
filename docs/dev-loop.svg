<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1940" width="1800" height="1940" font-family="'Cascadia Code', 'Consolas', monospace">
  <!-- Explicit white background so the diagram is readable on GitHub's dark theme. -->
  <rect width="1800" height="1940" fill="#ffffff"/>
  <style>
    .title { font-size: 36px; fill: #1e40af; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #64748b; }
    .stage-label { font-size: 22px; font-weight: 700; }
    .section-title { font-size: 22px; fill: #1e40af; font-weight: 700; }
    .tool { font-size: 16px; fill: #374151; }
    .tool-bold { font-size: 16px; fill: #374151; font-weight: 700; }
    .tool-muted { font-size: 14px; fill: #64748b; font-style: italic; }
    .gap-title { font-size: 17px; fill: #b91c1c; font-weight: 700; }
    .gap-fix { font-size: 14px; fill: #374151; }
    .legend { font-size: 14px; fill: #64748b; }
    rect { stroke-width: 2; }
  </style>

  <!-- Title -->
  <text x="40" y="65" class="title">Dev loop &amp; tooling</text>
  <text x="40" y="100" class="subtitle">Five stages from edit to runtime. Bold = fires autonomously. Italic = invoked manually.</text>

  <!-- Stage 1: Edit-time (purple, AI/LLM color) -->
  <rect x="40" y="140" width="320" height="70" rx="12" fill="#ddd6fe" stroke="#6d28d9"/>
  <text x="200" y="175" text-anchor="middle" class="stage-label" fill="#6d28d9">1. Edit-time</text>
  <text x="200" y="197" text-anchor="middle" font-size="14" fill="#6d28d9">IDE + Claude Code</text>

  <!-- Stage 2: Build-time (blue) -->
  <rect x="390" y="140" width="320" height="70" rx="12" fill="#60a5fa" stroke="#1e3a5f"/>
  <text x="550" y="175" text-anchor="middle" class="stage-label" fill="#ffffff">2. Build-time</text>
  <text x="550" y="197" text-anchor="middle" font-size="14" fill="#ffffff">dotnet build</text>

  <!-- Stage 3: Test-time (lighter blue) -->
  <rect x="740" y="140" width="320" height="70" rx="12" fill="#93c5fd" stroke="#1e3a5f"/>
  <text x="900" y="175" text-anchor="middle" class="stage-label" fill="#1e3a5f">3. Test-time</text>
  <text x="900" y="197" text-anchor="middle" font-size="14" fill="#1e3a5f">dotnet test</text>

  <!-- Stage 4: PR-time (yellow/decision) -->
  <rect x="1090" y="140" width="320" height="70" rx="12" fill="#fef3c7" stroke="#b45309"/>
  <text x="1250" y="175" text-anchor="middle" class="stage-label" fill="#b45309">4. PR-time</text>
  <text x="1250" y="197" text-anchor="middle" font-size="14" fill="#b45309">GitHub Actions + reviewers</text>

  <!-- Stage 5: Runtime (green/success) -->
  <rect x="1440" y="140" width="320" height="70" rx="12" fill="#a7f3d0" stroke="#047857"/>
  <text x="1600" y="175" text-anchor="middle" class="stage-label" fill="#047857">5. Merge / Runtime</text>
  <text x="1600" y="197" text-anchor="middle" font-size="14" fill="#047857">Aspire + Fly.io</text>

  <!-- Arrows between stages -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>
  <line x1="362" y1="175" x2="386" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="712" y1="175" x2="736" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="1062" y1="175" x2="1086" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="1412" y1="175" x2="1436" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Iteration loop arrow: PR back to Edit (review findings → fix) -->
  <path d="M 1250 220 Q 1250 280, 1100 280 Q 700 280, 200 280 Q 200 250, 200 218"
        stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="700" y="270" text-anchor="middle" font-size="12" fill="#dc2626" font-style="italic">CodeRabbit / arch-reviewer findings → fix → encode rule in .claude/ → push → re-review</text>

