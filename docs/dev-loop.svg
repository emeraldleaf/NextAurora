  <!-- ============================================================== -->
  <line x1="740" y1="320" x2="1060" y2="320" stroke="#1e3a5f" stroke-width="1"/>
  <text x="740" y="345" class="section-title" fill="#1e3a5f">Test-time</text>

  <text x="740" y="375" class="tool-muted">Unit tests</text>
  <text x="755" y="395" class="tool">xunit</text>
  <text x="755" y="413" class="tool">AwesomeAssertions</text>
  <text x="755" y="431" class="tool">NSubstitute</text>

  <text x="740" y="460" class="tool-muted">Integration tests</text>
