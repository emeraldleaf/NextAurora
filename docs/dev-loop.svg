  <text x="755" y="498" class="tool">Testcontainers (Docker)</text>
  <text x="755" y="516" class="tool-muted">  Catalog: Postgres + Redis</text>
  <text x="755" y="534" class="tool-muted">  Order: SQL Server + Wolverine</text>

