  <!-- Legend -->
  <text x="40" y="930" class="legend">━━━  flow from edit to runtime    ╌╌╌  iteration loop (review findings)    Bold = autonomous    Italic = manual    ◯ = gap with sized fix</text>

  <!-- ============================================================== -->
  <!-- Gaps section — single column so fix lines don't bleed across.   -->
  <!-- ============================================================== -->
  <rect x="40" y="970" width="1720" height="710" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="60" y="1005" class="title" fill="#b91c1c" font-size="22">Gaps — and the pragmatic fix for each</text>
  <text x="60" y="1030" class="subtitle">Each gap is sized to the actual problem, not maximum theoretical coverage. Full rationale in dev-loop.md.</text>

  <text x="60" y="1075" class="gap-title">1. Cross-service E2E over real Azure Service Bus wire not tested</text>
  <text x="60" y="1097" class="gap-fix">Fix: defer. Stubbed-transport tests cover load-bearing correctness. When this lands, gate as manual nightly (workflow_dispatch:), not per-PR.</text>

  <text x="60" y="1135" class="gap-title">2. No production performance baselines</text>
  <text x="60" y="1157" class="gap-fix">Fix: baseline exactly 2 endpoints (GET /products/{id}, POST /orders) at 100 concurrent. Capture P50/P95/P99 + GC + cache hit ratio. Re-measure quarterly.</text>

  <text x="60" y="1195" class="gap-title">3. .claude/settings.json accumulates session cruft</text>
  <text x="60" y="1217" class="gap-fix">Fix: don't build a hook. `git restore .claude/settings.json` periodically. If friction grows, add an 8-line Stop hook that strips non-whitelist entries.</text>

  <text x="60" y="1255" class="gap-title">4. GitHub Actions version-pinned, not SHA-pinned</text>
  <text x="60" y="1277" class="gap-fix">Fix: stick with @vN + Dependabot Actions weekly (tag-move detected within ~24h). If higher assurance needed, run pin-github-action on ALL actions in one PR.</text>

  <text x="60" y="1315" class="gap-title">5. No coverage gate</text>
  <text x="60" y="1337" class="gap-fix">Fix: codecov.yml with `coverage.status.project: target: auto, threshold: 1%`. Relative gate prevents regressions without perverse incentives of absolute thresholds.</text>

  <text x="60" y="1375" class="gap-title">6. AppHost smoke run is manual</text>
  <text x="60" y="1397" class="gap-fix">Fix: workflow_dispatch: against the Fly demo OR self-hosted Aspire. Skip per-PR; Aspire boot is 60+ seconds and most PRs don't change smoke surface.</text>

  <text x="60" y="1435" class="gap-title">7. No secret scanning beyond CodeQL</text>
  <text x="60" y="1457" class="gap-fix">Fix: add gitleaks/gitleaks-action@v2 (5 lines, free for public). Pair with quarterly `dotnet list package --vulnerable`.</text>

  <text x="60" y="1495" class="gap-title">8. Production migration deploy not automated</text>
  <text x="60" y="1517" class="gap-fix">Fix: separate deploy-migrate job with `environment: production-migration` requiring manual approval. Auto-migrating on prod startup is dangerous.</text>

  <text x="60" y="1555" class="gap-title">9. CodeRabbit + architecture-reviewer feel redundant</text>
  <text x="60" y="1577" class="gap-fix">Fix: keep both — complementary. CodeRabbit = rules-based, every PR. arch-reviewer = rule-application using CLAUDE.md, manual for non-trivial architectural changes.</text>

  <text x="60" y="1615" class="gap-title">10. No "AI-generated" commit tagging</text>
  <text x="60" y="1637" class="gap-fix">Fix: don't add a tag. The PR template covers the disclosure layer; Co-Authored-By line that Claude Code adds is sufficient signal where it's used.</text>

  <!-- ============================================================== -->
  <!-- Continuous Rule Encoding — the compounding feedback loop.      -->
  <!-- ============================================================== -->
  <rect x="40" y="1710" width="1720" height="180" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="60" y="1745" class="title" fill="#6d28d9" font-size="22">Continuous Rule Encoding — the feedback loop</text>
  <text x="60" y="1770" class="subtitle">When a review surface (CodeRabbit, arch-reviewer agent, test failure, incident) finds a pattern, encode it the same session. Per CLAUDE.md "a merged fix PR without the corresponding rule is a half-finished job."</text>

  <text x="60" y="1810" class="gap-title" fill="#6d28d9">Finding</text>
  <text x="160" y="1810" font-size="20" fill="#6d28d9">→</text>
  <text x="190" y="1810" class="tool-bold">Encode in:</text>
  <text x="310" y="1810" class="tool">CLAUDE.md</text>
  <text x="430" y="1810" font-size="14" fill="#64748b">+</text>
  <text x="450" y="1810" class="tool">.coderabbit.yaml path_instructions</text>
  <text x="780" y="1810" font-size="14" fill="#64748b">+</text>
  <text x="800" y="1810" class="tool">architecture-reviewer Pattern Checklist</text>
  <text x="1145" y="1810" font-size="14" fill="#64748b">+</text>
  <text x="1165" y="1810" class="tool">skill (if procedural)</text>

  <text x="60" y="1840" class="gap-title" fill="#6d28d9">Next cycle</text>
  <text x="180" y="1840" font-size="20" fill="#6d28d9">→</text>
  <text x="210" y="1840" class="tool">Edit-time auto-prevented from repeating the antipattern. CodeRabbit catches future violations at PR-time. Agent surfaces them at local review.</text>

  <text x="60" y="1870" class="tool-muted">For when to use agent vs slash command vs skill (and how each is invoked), see .claude/README.md.</text>

  <!-- Bottom footer -->
  <text x="60" y="1915" class="subtitle" font-style="italic">Full source in docs/dev-loop.md. Source .excalidraw at docs/dev-loop.excalidraw (open in Excalidraw to edit).</text>
</svg>
