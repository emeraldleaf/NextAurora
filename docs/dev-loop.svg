  <text x="405" y="552" class="tool">Directory.Build.props</text>
  <text x="405" y="570" class="tool">Directory.Packages.props</text>
  <text x="405" y="588" class="tool-muted">  (central package management)</text>

  <!-- ============================================================== -->
