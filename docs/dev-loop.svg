  <text x="1090" y="345" class="section-title" fill="#b45309">PR-time</text>

  <text x="1090" y="375" class="tool-muted">GitHub Actions workflows</text>
  <text x="1105" y="395" class="tool-bold">BUILD_AND_TEST</text>
  <text x="1105" y="413" class="tool-muted">  build + unit + integration + Codecov</text>
  <text x="1105" y="431" class="tool-bold">CodeQL (SAST)</text>
  <text x="1105" y="449" class="tool-bold">Dependabot</text>
  <text x="1105" y="467" class="tool-muted">  NuGet weekly + Actions monthly</text>
  <text x="1105" y="485" class="tool">deploy-catalog-demo-fly.yml</text>

  <text x="1090" y="514" class="tool-muted">PR-side config</text>
  <text x="1105" y="534" class="tool">PULL_REQUEST_TEMPLATE.md</text>
  <text x="1105" y="552" class="tool">AI_WORKFLOW.md</text>
  <text x="1105" y="570" class="tool">copilot-instructions.md</text>
  <text x="1105" y="588" class="tool">.coderabbit.yaml</text>

