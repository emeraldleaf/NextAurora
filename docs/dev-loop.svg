  <text x="405" y="395" class="tool-bold">Meziantou.Analyzer</text>
  <text x="405" y="413" class="tool-bold">SonarAnalyzer.CSharp</text>
  <text x="405" y="431" class="tool-bold">Roslynator.Analyzers</text>
  <text x="405" y="449" class="tool-bold">BannedApiAnalyzers</text>
