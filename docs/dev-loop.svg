  <text x="55" y="753" class="tool">variant-analysis</text>
  <text x="55" y="771" class="tool">writing-plans + executing-plans</text>
  <text x="55" y="789" class="tool">using-git-worktrees</text>
  <text x="55" y="807" class="tool">skill-security-auditor</text>
  <text x="55" y="825" class="tool">dotnet-performance, excalidraw-diagram</text>

  <text x="40" y="854" class="tool-muted">Secondary reviewer (in-editor)</text>
  <text x="55" y="874" class="tool">GitHub Copilot (GPT-5)</text>

